apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onestep
  namespace: onestep
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: onestep.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: onestep-frontend
                port:
                  number: 80
