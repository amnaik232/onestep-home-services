apiVersion: apps/v1
kind: Deployment
metadata:
  name: onestep-backend
  namespace: onestep
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: onestep-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: onestep-backend
    spec:
      serviceAccountName: onestep-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: mangtha/onestep-backend:1.0.0-20
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: onestep-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: onestep-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: onestep-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
