apiVersion: apps/v1
kind: Deployment
metadata:
  name: onestep-frontend
  namespace: onestep
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: onestep-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: onestep-frontend
    spec:
      serviceAccountName: onestep-runtime
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: mangtha/onestep-frontend:1.0.0-25
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
